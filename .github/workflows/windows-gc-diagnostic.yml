name: Windows GC diagnostic

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  windows-amd64:
    name: Windows amd64 checked compiler stress
    if: github.event.pull_request.draft
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: |
            go.work
            go.mod
            go.sum
      - name: Record Windows runner CPU
        shell: pwsh
        run: Get-CimInstance Win32_Processor | Select-Object Name, Manufacturer, NumberOfCores, NumberOfLogicalProcessors
      - name: Stress compiler recovery fixtures
        env:
          GOGC: "20"
        run: >-
          go test -count=1000 -tags=wago_regalloccheck
          -run '^(TestCompilePanicHasInternalClassification|TestCompileDebugPanicRethrowsOriginal|TestSourceContextSurvivesEarlyFunctionStateFailure)$'
          ./src/core/compiler/backend/railshot/amd64
      - name: Stress full checked AMD64 backend
        env:
          GOGC: "20"
        run: go test -count=20 -tags=wago_regalloccheck ./src/core/compiler/backend/railshot/amd64
