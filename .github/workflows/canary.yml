name: Publish canary

# A push to main publishes a canary only after that commit's CI run succeeds.
# Manual dispatches build the current main tip. Every successful target is
# attached to a uniquely tagged canary-* prerelease with the same asset names
# as nightly and stable.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-canary
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"
  TINYGO_VERSION: "0.41.1"

jobs:
  prepare:
    name: Resolve canary source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          fetch-depth: 1
      - name: Resolve version
        id: version
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=canary-${sha::7}" >> "$GITHUB_OUTPUT"
          echo "tag=canary-${sha::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build canary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            target: linux-amd64
            best_effort: false
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            target: linux-arm64
            best_effort: false
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            target: darwin-amd64
            best_effort: false
          - runner: macos-15
            goos: darwin
            goarch: arm64
            target: darwin-arm64
            best_effort: false
          - runner: windows-2025
            goos: windows
            goarch: amd64
            target: windows-amd64
            best_effort: false
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            target: windows-arm64
            best_effort: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        if: matrix.target != 'windows-arm64'
        with:
          tinygo-version: ${{ env.TINYGO_VERSION }}
          install-binaryen: false
      - name: Install lld
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build CLI and runtime profiles
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          WAGO_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          scripts/build-release-assets.sh
          scripts/verify-channel-assets.sh . "${{ matrix.target }}"
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-${{ matrix.target }}
          path: |
            wago-${{ matrix.target }}
            wago-${{ matrix.target }}.sha256
            wago-installer-${{ matrix.target }}
            wago-installer-${{ matrix.target }}.sha256
            wago-runtime-*-${{ matrix.target }}
            wago-runtime-*-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: Publish canary release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: canary-*
          merge-multiple: true
          path: release
      - name: Verify available release files
        run: |
          scripts/verify-channel-assets.sh release
      - name: Publish uniquely tagged canary release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f -name 'wago-*' -print | sort)
          test "${#assets[@]}" -gt 0
          notes=$(printf 'Automated canary build of main at `%s`. All supported Normal targets are required; unsupported Tiny variants are omitted. Unstable — may break without notice.\n\n' \
            '${{ needs.prepare.outputs.sha }}'; sed -n '1,$p' .github/release-asset-naming.md)
          if gh release view "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            target=$(gh api "repos/${{ github.repository }}/releases/tags/${{ needs.prepare.outputs.tag }}" --jq '.target_commitish')
            if [ "$target" != "${{ needs.prepare.outputs.sha }}" ]; then
              echo "GitHub release ${{ needs.prepare.outputs.tag }} has an invalid target commit: $target" >&2
              exit 1
            fi
            gh release upload "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --clobber "${assets[@]}"
            gh release edit "${{ needs.prepare.outputs.tag }}" --repo "${{ github.repository }}" --notes "$notes"
            echo "canary release already exists for ${{ needs.prepare.outputs.sha }}"
            exit 0
          fi
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --target "${{ needs.prepare.outputs.sha }}" \
            --title "Canary (${{ needs.prepare.outputs.version }})" \
            --notes "$notes" \
            --prerelease \
            "${assets[@]}"
      - name: Create documentation synchronization token
        id: docs-sync-token
        if: vars.DOCS_SYNC_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: wago-org
          repositories: docs
      - name: Synchronize canary documentation
        env:
          DOCS_SYNC_TOKEN: ${{ steps.docs-sync-token.outputs.token }}
        run: scripts/dispatch-docs-release.sh canary "${{ needs.prepare.outputs.tag }}" "${{ needs.prepare.outputs.sha }}"
