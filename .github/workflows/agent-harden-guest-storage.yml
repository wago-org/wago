name: Harden guest storage lifetime

on:
  push:
    branches: [agent/host-guest-storage]
    paths:
      - ".github/scripts/harden_guest_storage_lifetime.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: agent/host-guest-storage
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
      - name: Apply lifetime hardening
        run: python3 .github/scripts/harden_guest_storage_lifetime.py
      - name: Remove helper
        run: rm .github/scripts/harden_guest_storage_lifetime.py
      - name: Format changed Go files
        run: gofmt -w src/wago/guest_storage.go src/wago/hostcall.go src/wago/guest_storage_test.go src/wago/guest_storage_gc_amd64_test.go
      - name: Run focused tests
        run: go test ./src/wago ./src/core/runtime/gc -run 'Test(InstanceRuntimeFootprintBound|HostGuestStorage|ArrayPayloadView)'
      - name: Check generated facade
        run: |
          go generate ./...
          git diff --exit-code -- wago.go
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wago: harden guest storage borrow lifetime"
          git push origin HEAD:agent/host-guest-storage
