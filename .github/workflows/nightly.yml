name: Publish nightly

# Builds the CLI and runtime profiles once a day from main and publishes a
# uniquely tagged nightly prerelease. The manager resolves the newest nightly-*
# release tag at install time.
on:
  schedule:
    # 06:00 UTC daily (after most contributors' work has landed on main).
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-nightly
  cancel-in-progress: false

env:
  GO_VERSION: "1.22"
  TINYGO_VERSION: "0.41.1"

jobs:
  # Skip the build when main hasn't moved since the last nightly, so we don't
  # churn out identical binaries. Manual runs always build.
  check:
    name: New commits since last nightly?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      sha: ${{ steps.main.outputs.sha }}
      version: ${{ steps.main.outputs.version }}
      tag: ${{ steps.main.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
      - name: Resolve main
        id: main
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=nightly-$(date -u +%Y%m%d)-${sha::7}" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$(date -u +%Y%m%d)-$sha" >> "$GITHUB_OUTPUT"
      - name: Compare HEAD to the newest nightly release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq '.[] | select(.tag_name | startswith("nightly-")) | .target_commitish' \
            2>/dev/null | head -1 || true)
          if [ "$last" = "${{ steps.main.outputs.sha }}" ]; then
            echo "newest nightly already targets ${{ steps.main.outputs.sha }}; skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved ($last -> ${{ steps.main.outputs.sha }}); building"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build nightly (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: check
    if: needs.check.outputs.run == 'true'
    # A missing native JIT port must not prevent the supported targets from
    # reaching nightly. Successful matrix cells still upload their assets.
    continue-on-error: ${{ matrix.best_effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every target publishes both Normal profiles and supported Tiny builds.
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            target: linux-amd64
            best_effort: false
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            target: linux-arm64
            best_effort: false
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            target: darwin-amd64
            best_effort: false
          - runner: macos-15
            goos: darwin
            goarch: arm64
            target: darwin-arm64
            best_effort: false
          - runner: windows-2025
            goos: windows
            goarch: amd64
            target: windows-amd64
            best_effort: false
          - runner: windows-11-arm
            goos: windows
            goarch: arm64
            target: windows-arm64
            best_effort: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.check.outputs.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        if: matrix.target != 'windows-arm64'
        with:
          tinygo-version: ${{ env.TINYGO_VERSION }}
          # Release builds do not use Binaryen. Its pinned package has no
          # Linux/arm64 artifact, which would otherwise fail setup.
          install-binaryen: false
      - name: Install lld
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Build CLI and runtime profiles
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          WAGO_VERSION: ${{ needs.check.outputs.version }}
        run: |
          scripts/build-release-assets.sh
          scripts/verify-channel-assets.sh . "${{ matrix.target }}"

      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nightly-${{ matrix.target }}
          path: |
            wago-${{ matrix.target }}
            wago-${{ matrix.target }}.sha256
            wago-installer-${{ matrix.target }}
            wago-installer-${{ matrix.target }}.sha256
            wago-runtime-*-${{ matrix.target }}
            wago-runtime-*-${{ matrix.target }}.sha256
          if-no-files-found: error

  publish:
    name: Publish nightly release
    needs: [check, build]
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.check.outputs.sha }}
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nightly-*
          merge-multiple: true
          path: release
      - name: Verify available release files
        run: |
          scripts/verify-channel-assets.sh release

      # Each nightly gets a unique, never-retargeted tag; the CLI resolves the
      # newest nightly-* prerelease.
      - name: Publish uniquely tagged nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release -maxdepth 1 -type f -name 'wago-*' -print | sort)
          test "${#assets[@]}" -gt 0
          notes=$(printf 'Automated nightly build of `%s` (%s), %s. All supported Normal targets are required; unsupported Tiny variants are omitted. Prerelease — unstable, may break without notice.\n\n' \
            '${{ needs.check.outputs.sha }}' '${{ needs.check.outputs.version }}' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"; \
            sed -n '1,$p' .github/release-asset-naming.md)
          if gh release view "${{ needs.check.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            target=$(gh api "repos/${{ github.repository }}/releases/tags/${{ needs.check.outputs.tag }}" --jq '.target_commitish')
            if [ "$target" != "${{ needs.check.outputs.sha }}" ]; then
              echo "GitHub release ${{ needs.check.outputs.tag }} has an invalid target commit: $target" >&2
              exit 1
            fi
            gh release upload "${{ needs.check.outputs.tag }}" --repo "${{ github.repository }}" --clobber "${assets[@]}"
            gh release edit "${{ needs.check.outputs.tag }}" --repo "${{ github.repository }}" --notes "$notes"
          else
            gh release create "${{ needs.check.outputs.tag }}" \
              --repo "${{ github.repository }}" \
              --target "${{ needs.check.outputs.sha }}" \
              --title "Nightly ($(date -u +%Y-%m-%d))" \
              --notes "$notes" \
              --prerelease \
              "${assets[@]}"
          fi
      - name: Create documentation synchronization token
        id: docs-sync-token
        if: vars.DOCS_SYNC_APP_ID != ''
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.DOCS_SYNC_APP_ID }}
          private-key: ${{ secrets.DOCS_SYNC_APP_PRIVATE_KEY }}
          owner: wago-org
          repositories: docs
      - name: Synchronize nightly documentation
        env:
          DOCS_SYNC_TOKEN: ${{ steps.docs-sync-token.outputs.token }}
        run: scripts/dispatch-docs-release.sh nightly "${{ needs.check.outputs.tag }}" "${{ needs.check.outputs.sha }}"
