name: Apply guest storage CI fixes

on:
  push:
    branches: [agent/host-guest-storage]
    paths:
      - ".github/scripts/fix_guest_storage_ci.py"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: agent/host-guest-storage
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22.x"
      - name: Apply footprint fix
        run: python3 .github/scripts/fix_guest_storage_ci.py
      - name: Remove helper
        run: rm .github/scripts/fix_guest_storage_ci.py
      - name: Format changed sources
        run: gofmt -w src/wago/hostcall.go src/wago/guest_storage_alloc.go
      - name: Run focused guest-storage tests
        run: go test ./src/wago ./src/core/runtime/gc -run 'Test(InstanceRuntimeFootprintBound|HostGuestStorage|ArrayPayloadView)'
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "wago: fix guest storage CI regressions"
          git push origin HEAD:agent/host-guest-storage
