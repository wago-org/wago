name: Regression stress

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/regression-stress.yml'
      - 'docs/gc.md'
      - 'src/core/runtime/gc/**'
      - 'src/wago/*gc*'

permissions:
  contents: read

concurrency:
  group: regression-stress-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  repair-arm64-hostcall-pins:
    name: Repair arm64 host-call pin ordering
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/arm64-hostcall-pinned-local-spill'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Home pinned locals before host-call scratch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/core/compiler/backend/railshot/arm64/call.go')
          text = path.read_text()

          old = '''\ttypes, argSlot := f.flushSuffix(p)\n\tif p > 0 {\n'''
          new = '''\ttypes, argSlot := f.flushSuffix(p)\n\t// X9-X11 are eligible local pins as well as fixed host-log scratch. The\n\t// operand flush above makes every argument slot stable, so home locals before\n\t// reusing those registers. STACK_REG recovers them lazily after the call.\n\tf.spillLocalsForCall()\n\tif p > 0 {\n'''
          if text.count(old) != 1:
              raise SystemExit(f'async host-call insertion anchor count = {text.count(old)}, want 1')
          text = text.replace(old, new, 1)

          old = '''\t// Scratch entirely in X0/X9/X10/X11: a host call clobbers no wasm register\n\t// state, so pinned locals (which live in X19-X23) stay untouched.\n'''
          new = '''\t// The extended pin bank has already been homed, so X0/X9/X10/X11 are free\n\t// for the async host-log sequence below.\n'''
          if text.count(old) != 1:
              raise SystemExit(f'async host-call comment anchor count = {text.count(old)}, want 1')
          text = text.replace(old, new, 1)

          old = '''\tf.dropFlushedSuffix(types, p)\n\treturn nil\n}\n\n// moduleUsesSyncHostCalls'''
          new = '''\tf.dropFlushedSuffix(types, p)\n\t// The legacy non-STACK_REG model restores pins eagerly. STACK_REG leaves\n\t// them memory-resident and recovers each local on its next read.\n\tf.reloadLocalsForCall()\n\treturn nil\n}\n\n// moduleUsesSyncHostCalls'''
          if text.count(old) != 1:
              raise SystemExit(f'async host-call reload anchor count = {text.count(old)}, want 1')
          text = text.replace(old, new, 1)

          old = '''\tf.flush()                   // operands to canonical slot-width slots\n\tf.storePinnedGlobals(false) // coherence/preservation for value-pinned caller-saved globals\n'''
          new = '''\tf.flush()                   // operands to canonical slot-width slots\n\t// X9-X11 are part of the extended local-pin bank. Home every dirty pin before\n\t// globals, control-frame setup, or argument marshalling reuses those registers.\n\tf.spillLocalsForCall()\n\tf.storePinnedGlobals(false) // coherence/preservation for value-pinned caller-saved globals\n'''
          if text.count(old) != 1:
              raise SystemExit(f'sync host-call insertion anchor count = {text.count(old)}, want 1')
          text = text.replace(old, new, 1)

          old = '''\t\targSlot += mt.stackSlots()\n\t\tctrlSlot += mt.stackSlots()\n\t}\n\tf.spillLocalsForCall()\n\tf.a.MovImm64(X16, uint64(uint32(importIdx)))\n'''
          new = '''\t\targSlot += mt.stackSlots()\n\t\tctrlSlot += mt.stackSlots()\n\t}\n\tf.a.MovImm64(X16, uint64(uint32(importIdx)))\n'''
          if text.count(old) != 1:
              raise SystemExit(f'late sync host-call spill anchor count = {text.count(old)}, want 1')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          gofmt -w src/core/compiler/backend/railshot/arm64/call.go src/wago/hostcall_pinned_local_arm64_test.go
      - name: Run native arm64 regression
        run: go test -count=1 ./src/wago -run '^TestARM64HostCallPreservesExtendedPinnedLocals$'
      - name: Commit production fix and remove repair scaffold
        shell: bash
        run: |
          git fetch --no-tags origin main
          git show origin/main:.github/workflows/regression-stress.yml > .github/workflows/regression-stress.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/compiler/backend/railshot/arm64/call.go src/wago/hostcall_pinned_local_arm64_test.go .github/workflows/regression-stress.yml
          git diff --cached --check
          git commit -m "arm64: preserve pinned locals across host-call scratch"
          git push origin HEAD:${GITHUB_HEAD_REF}

  gc-hardening:
    name: GC hardening / ${{ matrix.arch }} / ${{ matrix.bounds }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            bounds: explicit
            tags: wagodebug
          - arch: amd64
            runner: ubuntu-24.04
            bounds: guard-page
            tags: wagodebug,wago_guardpage
          - arch: arm64
            runner: ubuntu-24.04-arm
            bounds: explicit
            tags: wagodebug
          - arch: arm64
            runner: ubuntu-24.04-arm
            bounds: guard-page
            tags: wagodebug,wago_guardpage
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run collector oracle, injection, fuzz seeds, and stress suites
        run: go test -count=3 -tags '${{ matrix.tags }}' ./src/core/runtime/gc
      - name: Run native GC root and host-transition stress
        run: go test -count=3 -tags '${{ matrix.tags }}' -run 'Test(RuntimeGCHostFuncRefCallAndTailOwnership|GenericGCResultsIssueBoundedHostTokens|GCCrossInstanceCallsWithSharedPersistentRoots|GCHostReentryNativeFrameRoots|GCArm64HostReentryRoots|GCWarmSnapshotPreservesCyclesAndSharing)$' ./src/wago

  stress:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run repeated, optimizer, guard-page, and fuzz matrices
        run: tests/scripts/regression-stress.sh
