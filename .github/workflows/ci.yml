name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  # Decide whether the change can affect executable code. Docs-only changes skip
  # the expensive jobs; every code change runs the complete native platform
  # matrix so architecture and OS interactions cannot hide behind path filters.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.derive.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050
        id: filter
        with:
          # Avoid a separate PR-files API call; compare the checked-out merge
          # ref with the base SHA from the pull_request event instead.
          token: ''
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
      - name: Derive job gates
        id: derive
        run: |
          code='${{ steps.filter.outputs.code }}'
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "gate: code=$code"

  lint:
    name: Lint & format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum (stdlib-only module) -> nothing to cache; avoids a warning.
          cache: false

      # `make lint` runs staticcheck when it is on PATH; install it first so CI
      # enforces it (locally it is an optional skip). Other checks (gofmt, go
      # generate sync, go vet) use the toolchain directly.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1

      - name: Lint
        run: make lint

  regression-corpus:
    name: Regression corpus provenance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install corpus build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake jq ninja-build
      - name: Read pinned WABT provenance
        id: wabt
        run: |
          go test ./tests/regressioncorpus
          repo="$(jq -er '.wabt_repo | select(test("^https://[^[:space:]]+$"))' tests/regressions/runtime/PROVENANCE.json)"
          revision="$(jq -er '.wabt_revision | select(test("^[0-9a-f]{40}$"))' tests/regressions/runtime/PROVENANCE.json)"
          printf 'repo=%s\n' "$repo" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Build pinned WABT from verified source
        run: |
          git clone --filter=blob:none --no-checkout "${{ steps.wabt.outputs.repo }}" .tmp/wabt
          git -C .tmp/wabt fetch --depth=1 origin "${{ steps.wabt.outputs.revision }}"
          git -C .tmp/wabt checkout --detach "${{ steps.wabt.outputs.revision }}"
          git -C .tmp/wabt submodule update --init --recursive
          test "$(git -C .tmp/wabt remote get-url origin)" = "${{ steps.wabt.outputs.repo }}"
          test "$(git -C .tmp/wabt rev-parse HEAD)" = "${{ steps.wabt.outputs.revision }}"
          test -z "$(git -C .tmp/wabt status --porcelain --untracked-files=no)"
          test -z "$(git -C .tmp/wabt submodule status --recursive | grep -E '^[+-U]' || true)"
          cmake -S .tmp/wabt -B .tmp/wabt/build -G Ninja -DBUILD_TESTS=OFF
          cmake --build .tmp/wabt/build --target wast2json
      - name: Verify pinned upstream sources and generated artifacts
        run: |
          test "$(git -C .tmp/wabt remote get-url origin)" = "${{ steps.wabt.outputs.repo }}"
          test "$(git -C .tmp/wabt rev-parse HEAD)" = "${{ steps.wabt.outputs.revision }}"
          test -z "$(git -C .tmp/wabt status --porcelain --untracked-files=no)"
          test -z "$(git -C .tmp/wabt submodule status --recursive | grep -E '^[+-U]' || true)"
          go run ./tests/tools/regression-corpus \
            -repo "$PWD" \
            -upstream "$PWD/.tmp/regression-corpus-upstream" \
            -wast2json "$PWD/.tmp/wabt/build/wast2json" \
            -fetch

  race:
    name: Race detector / Linux amd64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run focused runtime race suites
        run: go test -race -count=1 ./src/wago ./src/core/runtime

  platform-test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            runtime: true
            guard: true
            corpus: true
          - name: Linux / arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            runtime: true
            guard: true
            corpus: true
          - name: Darwin / amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            runtime: true
            guard: true
            corpus: true
          - name: Darwin / arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            runtime: true
            guard: true
            corpus: true
          - name: Windows / amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            runtime: true
            guard: true
            corpus: true
          - name: Windows / arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            runtime: true
            guard: true
            corpus: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum (stdlib-only module) -> nothing to cache; avoids a warning.
          cache: false

      # Codegen and corpus tests use wat2wasm. Install it on every platform so
      # missing tooling cannot turn coverage into a silent skip.
      - name: Install wabt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: Install wabt (macOS)
        if: runner.os == 'macOS'
        run: brew install wabt
      - name: Install wabt (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # WABT does not publish a Chocolatey package. Its official Windows x64
        # build runs natively on amd64 and through Windows 11 ARM emulation.
        run: ./tests/scripts/install-wabt-windows.ps1

      - name: Verify native runner
        if: runner.os != 'Windows'
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
          go version
          uname -a

      - name: Verify native runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($(go env GOOS) -ne '${{ matrix.goos }}') { throw 'wrong GOOS' }
          if ($(go env GOARCH) -ne '${{ matrix.goarch }}') { throw 'wrong GOARCH' }
          go version
          Get-ComputerInfo | Select-Object OsName, OsArchitecture

      - name: Build & test
        if: matrix.runtime && runner.os != 'Windows'
        run: make test

      - name: Build & test (Windows)
        if: matrix.runtime && runner.os == 'Windows'
        shell: pwsh
        run: |
          go build ./...
          go build -tags wago_runtime ./cli/...
          go test -count=1 ./...
          go test -count=1 -tags wago_runtime ./cli/...

      # Guard-page (signals-based) mode is behind a build tag, so `make test`
      # never exercises it — which is how a broken SIGSEGV fault->trap handler
      # stayed CI-invisible. This runs the fault->trap path plus in-bounds
      # differential correctness under the tag.
      - name: Guard-page trap tests
        if: matrix.guard && runner.os != 'Windows'
        run: make test-guard

      - name: Guard-page trap tests (Windows)
        if: matrix.guard && runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -count=1 -tags wago_guardpage ./src/wago/
          Push-Location bench
          try {
            go test -count=1 -tags wago_guardpage -run 'TestCorpusDifferential|TestJsonAsGuardCorrect' .
          } finally {
            Pop-Location
          }

      - name: Corpus correctness matrix
        if: matrix.corpus && runner.os != 'Windows'
        env:
          WAGO_CORPUS_TIMEOUT: 20s
        run: make test-corpus

      - name: Corpus correctness matrix (Windows)
        if: matrix.corpus && runner.os == 'Windows'
        shell: pwsh
        working-directory: bench
        env:
          WAGO_CORPUS_TIMEOUT: 20s
        run: go test -count=1 -run '^TestCorpus$' .

      - name: Fetch SIMD proposal suite
        if: matrix.runtime
        run: git submodule update --init tests/spec

      - name: SIMD execution suite
        if: matrix.runtime && runner.os != 'Windows'
        run: make simd

      - name: SIMD execution suite (Windows)
        if: matrix.runtime && runner.os == 'Windows'
        shell: pwsh
        run: |
          git submodule update --init tests/spec
          $env:WAGO_SPECTEST_DIR = (Resolve-Path tests/spec)
          $env:WAGO_SPEC_VERSION = 'simd'
          go test -count=1 -run TestSpecSuiteExec -v ./src/wago/

  core-v2:
    name: Core v2 conformance / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # This is the mandatory exact Release 2 gate, not the informational CI
      # card summary. Provision the parser explicitly and fetch only the pinned
      # WebAssembly/spec v2.0.0 submodule consumed by make spec2.
      - name: Install WABT
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: Fetch pinned Core v2 corpus
        run: git submodule update --init tests/spec-v2
      - name: Run exact Core v2 validation and execution
        run: make spec2

  tinygo:
    name: TinyGo / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / amd64
            runner: ubuntu-24.04
            runtime: true
            cli: true
          - name: Linux / arm64
            runner: ubuntu-24.04-arm
            runtime: true
            cli: true
          - name: Darwin / amd64
            runner: macos-15-intel
            runtime: false
            cli: false
          - name: Darwin / arm64
            runner: macos-15
            runtime: true
            cli: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        with:
          tinygo-version: "0.41.1"
          # Native builds do not use Binaryen, whose pinned release has no
          # Linux/arm64 artifact and otherwise makes setup fail with a 404.
          install-binaryen: false

      # TinyGo links native linux/amd64 binaries with LLVM lld; the runner needs
      # ld.lld on PATH (otherwise: "ROM segments are non-contiguous").
      - name: Install lld
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      # Compile portability: the whole pipeline (wasm -> amd64 -> runtime ->
      # public API + CLI) must build under TinyGo. A NOTE: the output name must
      # not end in .bin, which TinyGo treats as a firmware image.
      - name: Build CLI with TinyGo
        if: matrix.cli
        run: make tinygo-build

      # Runtime behavior exercises the generated amd64/arm64 foreign-stack
      # trampolines and synchronous host-call resume path natively.
      - name: Test (runtime + public API) under TinyGo
        if: matrix.runtime
        run: make tinygo-test

      # Darwin/amd64 mirrors the Big Go matrix: the native JIT ABI is not yet
      # implemented, but architecture-neutral compiler and encoder code must
      # remain buildable and testable under TinyGo.
      - name: Portable compiler tests under TinyGo
        if: ${{ !matrix.runtime }}
        run: tinygo test ./src/core/compiler/codegen ./src/core/compiler/ir ./src/core/encoder/amd64 ./src/core/encoder/arm64

      # End-to-end smoke: the TinyGo-built JIT must execute a real module.
      - name: Smoke-run a real module
        if: matrix.cli
        run: |
          out="$(./wago-tinygo run --invoke fib tests/fixtures/wasm/fib.wasm 20)"
          echo "$out"
          test "$out" = "fib(20) = 6765"

  # The CI card is built by three jobs so the expensive bits run in parallel: this
  # job produces the Go-only fragments (coverage/tests/spec), the `size` job builds
  # the TinyGo release binary for the "Build size" fragment, and `card-comment`
  # waits for both, assembles, and posts the sticky comment.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum (stdlib-only module) -> nothing to cache; avoids a warning.
          cache: false

      # wabt provides wast2json for the WebAssembly spec-suite card producer (and
      # wat2wasm for the codegen tests that feed coverage).
      - name: Install wabt (wast2json / wat2wasm)
        run: sudo apt-get update && sudo apt-get install -y wabt

      # Produce the coverage/tests/spec fragments. On PRs, CARD_BASELINE_REF
      # measures main in a worktree for the "Δ vs main" columns, so fetch main.
      # Coverage merges the normal, guard-page, spec1, spec2, and SIMD gates.
      # The spec card still renders its own per-version accounting afterward.
      - name: Produce card fragments
        env:
          CARD_BASELINE_REF: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
        run: |
          if [ -n "$CARD_BASELINE_REF" ]; then
            git fetch --no-tags --depth=1 origin main
          fi
          make card-fragments

      - name: Upload card fragments
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: card-fragments
          path: ci-card
          if-no-files-found: error

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  size:
    name: Build size
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # TinyGo (+ lld) builds the size-minimized run-only release profile.
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3
        with:
          tinygo-version: "0.41.1"
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Measure release binary size
        env:
          CARD_BASELINE_REF: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
        run: |
          if [ -n "$CARD_BASELINE_REF" ]; then
            git fetch --no-tags --depth=1 origin main
          fi
          mkdir -p ci-card
          SIZE_REPORT=ci-card/size.md scripts/size-card.sh

      - name: Upload size fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: card-size
          path: ci-card/size.md
          if-no-files-found: error

  card-comment:
    name: Comment CI card
    needs: [coverage, size]
    runs-on: ubuntu-latest
    # Only PRs from this repo get a comment; fork PRs have a read-only token.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download card fragments
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: card-fragments
          path: ci-card
      - name: Download size fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: card-size
          path: ci-card
      - name: Assemble and post the CI card
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          CARD_DIR=ci-card CARD_FILE=card.md scripts/pr-card.sh
          scripts/pr-card-comment.sh

  # Single aggregation gate. Because the path-gated jobs above can be "skipped",
  # make THIS the sole required status check in branch protection: it always runs
  # and passes only if no needed job actually failed (skipped/success both pass).
  ci-ok:
    name: CI
    if: always()
    needs: [changes, lint, regression-corpus, race, platform-test, core-v2, tinygo, coverage, size]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
          echo "all required jobs passed or were skipped"
