name: Quality ARM64 measurements
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - issue: p06
            commit: aee81cce36c4d90f22abb1ed8d0a406df4752c7d
            benchmark_file: branch_hint_lookup_bench_test.go
            benchmark: '^BenchmarkCompileBranchHintLookupARM64$'
            tests: '^TestCompileBranchHintLookupARM64Fixtures$'
    env:
      GOMAXPROCS: '2'
      PACKAGE: src/core/compiler/backend/railshot/arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: b706c110b47d65f319b8488140454a8dd857f967
          path: baseline
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.commit }}
          path: fixed
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.22'
          cache: false
      - name: Build matched test binaries and run safe fixed-code checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          uname -a > evidence/host.txt
          go version >> evidence/host.txt
          lscpu >> evidence/host.txt
          cp "fixed/$PACKAGE/${{ matrix.benchmark_file }}" "baseline/$PACKAGE/"
          (cd baseline && go test -c -o "$RUNNER_TEMP/before.test" "./$PACKAGE")
          (cd fixed && go test -c -o "$RUNNER_TEMP/after.test" "./$PACKAGE")
          (cd baseline && go test -count=1 -v -run '${{ matrix.tests }}' "./$PACKAGE") > evidence/baseline-tests.txt 2>&1
          (cd fixed && go test -count=1 -v -run '${{ matrix.tests }}' "./$PACKAGE") > evidence/tests.txt 2>&1
      - name: Measure paired native ARM64 compilation
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/evidence"
          for sample in 1 2 3 4 5 6; do
            order='before after'
            if ((sample % 2 == 0)); then order='after before'; fi
            for side in $order; do
              tree=baseline
              if [[ "$side" == after ]]; then tree=fixed; fi
              (cd "$tree/$PACKAGE" && "$RUNNER_TEMP/$side.test" -test.run='^$' -test.bench='${{ matrix.benchmark }}' -test.benchmem -test.benchtime=500ms -test.count=1) >> "$output/$side-paired.txt"
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: quality-${{ matrix.issue }}-arm64
          path: evidence
