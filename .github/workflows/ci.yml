name: Native rebase ARM64 validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-rebase-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native:
    name: Native ARM64 PR${{ matrix.pr }} / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - pr: 986
            os: Linux
            runner: ubuntu-24.04-arm
            source: 715da6612d72095266fbae4d6d46de1761038790
            selector: '^(TestSharedGrowDynamicFailure|TestSharedGrowLargeMemoryIndex)'
          - pr: 986
            os: Darwin
            runner: macos-15
            source: 715da6612d72095266fbae4d6d46de1761038790
            selector: '^(TestSharedGrowDynamicFailure|TestSharedGrowLargeMemoryIndex)'
          - pr: 995
            os: Linux
            runner: ubuntu-24.04-arm
            source: 12e41e0fda71b46e874130aa4a7a96509d8bf930
            selector: '^(TestIndexedAtomicWait|TestAtomicWaitFast)'
          - pr: 995
            os: Darwin
            runner: macos-15
            source: 12e41e0fda71b46e874130aa4a7a96509d8bf930
            selector: '^(TestIndexedAtomicWait|TestAtomicWaitFast)'
    env:
      CGO_ENABLED: '0'
      GOMAXPROCS: '4'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.source }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: true
      - name: Verify native source and architecture
        shell: bash
        run: |
          test "$RUNNER_ARCH" = ARM64
          uname -m
          go env GOOS GOARCH
          git rev-parse HEAD
      - name: Ordinary cancellation and ordering correctness
        shell: bash
        run: go test -v -count=3 -timeout=5m -run '${{ matrix.selector }}' ./src/wago | tee ordinary.log
      - name: Checked and profiled cancellation and ordering correctness
        shell: bash
        run: go test -v -count=3 -timeout=5m -tags=wago_regalloccheck,wago_profile -run '${{ matrix.selector }}' ./src/wago | tee checked-profile.log
      - name: Upload exact-source logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-pr${{ matrix.pr }}-${{ matrix.os }}
          path: |
            ordinary.log
            checked-profile.log
          if-no-files-found: warn
