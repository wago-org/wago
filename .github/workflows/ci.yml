name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. new pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:
  # Decide whether the change can affect executable code. Docs-only changes skip
  # the expensive jobs; every code change runs the complete native platform
  # matrix so architecture and OS interactions cannot hide behind path filters.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.derive.outputs.code }}
      docs: ${{ steps.derive.outputs.docs }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dorny/paths-filter@6852f92c20ea7fd3b0c25de3b5112db3a98da050
        id: filter
        with:
          # Avoid a separate PR-files API call; compare the checked-out merge
          # ref with the base SHA from the pull_request event instead.
          token: ''
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'LICENSE'
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
      - name: Derive job gates
        id: derive
        run: |
          code='${{ steps.filter.outputs.code }}'
          docs='${{ steps.filter.outputs.docs }}'
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "gate: code=$code docs=$docs"

  docs:
    name: Documentation
    needs: changes
    # Code-only changes can delete or rename a path referenced by unchanged
    # documentation, so validate both documentation and executable changes.
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Validate documentation
        run: make docs-check

  lint:
    name: Lint & format
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum (stdlib-only module) -> nothing to cache; avoids a warning.
          cache: false

      # `make lint` runs staticcheck when it is on PATH; install it first so CI
      # enforces it (locally it is an optional skip). Other checks (gofmt, go
      # generate sync, go vet) use the toolchain directly.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2024.1.1

      - name: Lint
        run: make lint

  regression-corpus:
    name: Regression corpus provenance
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install corpus build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake jq ninja-build
      - name: Read pinned WABT provenance
        id: wabt
        run: |
          go test ./tests/regressioncorpus
          repo="$(jq -er '.wabt_repo | select(test("^https://[^[:space:]]+$"))' tests/regressions/runtime/PROVENANCE.json)"
          revision="$(jq -er '.wabt_revision | select(test("^[0-9a-f]{40}$"))' tests/regressions/runtime/PROVENANCE.json)"
          printf 'repo=%s\n' "$repo" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Build pinned WABT from verified source
        run: |
          git clone --filter=blob:none --no-checkout "${{ steps.wabt.outputs.repo }}" .tmp/wabt
          git -C .tmp/wabt fetch --depth=1 origin "${{ steps.wabt.outputs.revision }}"
          git -C .tmp/wabt checkout --detach "${{ steps.wabt.outputs.revision }}"
          git -C .tmp/wabt submodule update --init --recursive
          test "$(git -C .tmp/wabt remote get-url origin)" = "${{ steps.wabt.outputs.repo }}"
          test "$(git -C .tmp/wabt rev-parse HEAD)" = "${{ steps.wabt.outputs.revision }}"
          test -z "$(git -C .tmp/wabt status --porcelain --untracked-files=no)"
          test -z "$(git -C .tmp/wabt submodule status --recursive | grep -E '^[+-U]' || true)"
          cmake -S .tmp/wabt -B .tmp/wabt/build -G Ninja -DBUILD_TESTS=OFF
          cmake --build .tmp/wabt/build --target wast2json
      - name: Verify pinned upstream sources and generated artifacts
        run: |
          test "$(git -C .tmp/wabt remote get-url origin)" = "${{ steps.wabt.outputs.repo }}"
          test "$(git -C .tmp/wabt rev-parse HEAD)" = "${{ steps.wabt.outputs.revision }}"
          test -z "$(git -C .tmp/wabt status --porcelain --untracked-files=no)"
          test -z "$(git -C .tmp/wabt submodule status --recursive | grep -E '^[+-U]' || true)"
          go run ./tests/tools/regression-corpus \
            -repo "$PWD" \
            -upstream "$PWD/.tmp/regression-corpus-upstream" \
            -wast2json "$PWD/.tmp/wabt/build/wast2json" \
            -fetch

  runtime-concurrency:
    name: Runtime concurrency / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run bounded seeded runtime concurrency harness
        env:
          WAGO_CONCURRENCY_SEED: 439000001,439000019,439000043,439000081
          WAGO_CONCURRENCY_ROUNDS: 24
        run: make test-concurrency

  race:
    name: Race detector / Linux amd64
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # Several amd64 runtime tests discover the pinned Core 3 checkout before
      # deciding whether an unavailable conversion tool makes the case skippable.
      # Fetch the corpus so the race lane reports races rather than checkout noise.
      - name: Initialize Release 3 suite
        run: git submodule update --init --depth=1 tests/spec-v3
      - name: Run focused runtime race suites
        run: go test -race -count=1 ./src/wago ./src/core/runtime ./tests/runtimeconcurrency

  platform-test:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            runtime: true
            guard: true
            corpus: true
          - name: Linux / arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            runtime: true
            guard: true
            corpus: true
          - name: Darwin / amd64
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            runtime: true
            guard: true
            corpus: true
          - name: Darwin / arm64
            runner: macos-15
            goos: darwin
            goarch: arm64
            runtime: true
            guard: true
            corpus: true
          - name: Windows / amd64
            runner: windows-2025
            goos: windows
            goarch: amd64
            runtime: true
            guard: true
            corpus: true
          - name: Windows / arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            runtime: true
            guard: true
            corpus: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum (stdlib-only module) -> nothing to cache; avoids a warning.
          cache: false

      # Runtime codegen uses syntax unavailable in distro WABT releases. Publish
      # the checksum-pinned tool directory on every supported Unix runtime host.
      - name: Bootstrap pinned WABT
        if: matrix.runtime && runner.os != 'Windows'
        run: |
          scripts/bootstrap-wabt.sh --verify
          echo "$(dirname "$(scripts/bootstrap-wabt.sh --print-path)")" >> "$GITHUB_PATH"

      # Only linux/amd64 builds the supplementary official Core 3 tests during
      # ordinary package testing. Initialize and build their authoritative
      # interpreter fallback there; other runtime cells avoid the large OCaml
      # toolchain and verify the portable/backend surface directly.
      - name: Initialize Release 3 suite
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: git submodule update --init --depth=1 tests/spec-v3

      - name: Install Release 3 interpreter toolchain
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: sudo apt-get update && sudo apt-get install -y ocaml-nox ocaml-dune menhir

      - name: Bootstrap pinned Release 3 interpreter
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          interpreter="$(scripts/bootstrap-spec-interpreter.sh --print-path)"
          scripts/bootstrap-spec-interpreter.sh --verify
          echo "WAGO_SPEC_INTERPRETER=$interpreter" >> "$GITHUB_ENV"
          echo "WAGO_SPEC_INTERPRETER_REVISION=$(scripts/bootstrap-spec-interpreter.sh --print-revision)" >> "$GITHUB_ENV"

      # WABT does not publish a Chocolatey package. Its checksum-pinned official
      # Windows x64 build runs natively on amd64 and under Windows 11 ARM emulation.
      - name: Install wabt (Windows)
        if: matrix.runtime && runner.os == 'Windows'
        shell: pwsh
        run: ./tests/scripts/install-wabt-windows.ps1

      - name: Verify native runner
        if: runner.os != 'Windows'
        run: |
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
          go version
          uname -a

      - name: Verify native runner (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($(go env GOOS) -ne '${{ matrix.goos }}') { throw 'wrong GOOS' }
          if ($(go env GOARCH) -ne '${{ matrix.goarch }}') { throw 'wrong GOARCH' }
          go version
          Get-ComputerInfo | Select-Object OsName, OsArchitecture

      - name: Build & test
        if: matrix.runtime && runner.os != 'Windows'
        run: make test

      - name: Build & test (Windows)
        if: matrix.runtime && runner.os == 'Windows'
        shell: pwsh
        run: |
          go build ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags wago_runtime ./cli/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -count=1 -tags wago_runtime ./cli/...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Guard-page (signals-based) mode is behind a build tag, so `make test`
      # never exercises it — which is how a broken SIGSEGV fault->trap handler
      # stayed CI-invisible. This runs the fault->trap path plus in-bounds
      # differential correctness under the tag.
      - name: Guard-page trap tests
        if: matrix.guard && runner.os != 'Windows'
        run: make test-guard

      - name: Guard-page trap tests (Windows)
        if: matrix.guard && runner.os == 'Windows'
        shell: pwsh
        run: |
          go test -v -count=1 -tags wago_guardpage ./src/core/runtime ./src/wago/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location bench
          try {
            go test -v -count=1 -tags wago_guardpage -run 'TestCorpusDifferential|TestJsonAsGuardCorrect' .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

      - name: Corpus correctness matrix
        if: matrix.corpus && runner.os != 'Windows'
        env:
          WAGO_CORPUS_TIMEOUT: 20s
        run: make test-corpus

      - name: Corpus correctness matrix (Windows)
        if: matrix.corpus && runner.os == 'Windows'
        shell: pwsh
        working-directory: bench
        env:
          WAGO_CORPUS_TIMEOUT: 20s
        run: go test -count=1 -run '^TestCorpus$' .

      - name: Fetch SIMD proposal suite
        if: matrix.runtime
        run: git submodule update --init tests/spec

      - name: SIMD execution suite
        if: matrix.runtime && runner.os != 'Windows'
        run: make simd

      - name: SIMD execution suite (Windows)
        if: matrix.runtime && runner.os == 'Windows'
        shell: pwsh
        run: |
          git submodule update --init tests/spec
          $env:WAGO_SPECTEST_DIR = (Resolve-Path tests/spec)
          $env:WAGO_SPEC_VERSION = 'simd'
          go test -count=1 -run TestSpecSuiteExec -v ./src/wago/

  core-v2:
    name: Core v2 conformance / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      # This is the mandatory exact Release 2 gate, not the informational CI
      # card summary. Provision the parser explicitly and fetch only the pinned
      # WebAssembly/spec v2.0.0 submodule consumed by make spec2.
      - name: Install WABT
        run: sudo apt-get update && sudo apt-get install -y wabt
      - name: Fetch pinned Core v2 corpus
        run: git submodule update --init tests/spec-v2
      - name: Run exact Core v2 validation and execution
        run: make spec2

  core-v3:
    name: Core v3 conformance / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64 / explicit
            runner: ubuntu-24.04
            target: spec3
          - name: Linux amd64 / signals
            runner: ubuntu-24.04
            target: spec3-signals
          - name: Linux arm64 / explicit
            runner: ubuntu-24.04-arm
            target: spec3
          - name: Linux arm64 / signals
            runner: ubuntu-24.04-arm
            target: spec3-signals
          - name: Darwin arm64 / explicit
            runner: macos-15
            target: spec3
          - name: Darwin arm64 / signals
            runner: macos-15
            target: spec3-signals
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Install Release 3 interpreter toolchain
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y ocaml-nox ocaml-dune menhir
          else
            brew install ocaml dune menhir
          fi
      - name: Fetch pinned Core v3 corpus
        run: git submodule update --init tests/spec-v3
      - name: Run exact Core v3 validation and execution
        run: make ${{ matrix.target }}

  tinygo:
    name: TinyGo / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / amd64
            runner: ubuntu-24.04
            runtime: true
            cli: true
          - name: Linux / arm64
            runner: ubuntu-24.04-arm
            runtime: true
            cli: true
          - name: Darwin / amd64
            runner: macos-15-intel
            runtime: false
            cli: false
          - name: Darwin / arm64
            runner: macos-15
            runtime: true
            cli: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3 # v2
        with:
          tinygo-version: "0.41.1"
          # Native builds do not use Binaryen, whose pinned release has no
          # Linux/arm64 artifact and otherwise makes setup fail with a 404.
          install-binaryen: false

      # TinyGo links native linux/amd64 binaries with LLVM lld; the runner needs
      # ld.lld on PATH (otherwise: "ROM segments are non-contiguous").
      - name: Install lld
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      # Drive the manager with standard Go while TinyGo links and executes the
      # final runtime-only binary. This covers target-policy handoff, portable
      # stripping, and cooperative interruption of a CPU-bound guest.
      - name: Test precompiled standalone under TinyGo
        if: runner.os == 'Linux'
        run: go test -count=1 -run '^(TestBuildTinyGoEmbedsArtifactWithoutCompiler|TestBuildTinyGoStripsByDefault|TestTinyGoArtifactSupportsCooperativeInterruption)$' ./cli/manager/internal/standalone

      # Compile portability: the whole pipeline (wasm -> amd64 -> runtime ->
      # public API + CLI) must build under TinyGo. A NOTE: the output name must
      # not end in .bin, which TinyGo treats as a firmware image.
      - name: Build CLI with TinyGo
        if: matrix.cli
        run: make tinygo-build

      # Runtime behavior exercises the generated amd64/arm64 foreign-stack
      # trampolines and synchronous host-call resume path natively.
      - name: Test (runtime + public API) under TinyGo
        if: matrix.runtime
        run: make tinygo-test

      # Darwin/amd64 mirrors the Big Go matrix: the native JIT ABI is not yet
      # implemented, but architecture-neutral compiler and encoder code must
      # remain buildable and testable under TinyGo.
      - name: Portable compiler tests under TinyGo
        if: ${{ !matrix.runtime }}
        run: tinygo test ./src/core/compiler/codegen ./src/core/compiler/ir ./src/core/encoder/amd64 ./src/core/encoder/arm64

      # End-to-end smoke: the TinyGo-built JIT must execute a real module.
      - name: Smoke-run a real module
        if: matrix.cli
        run: |
          out="$(./wago-tinygo run --invoke fib tests/fixtures/wasm/fib.wasm 20)"
          echo "$out"
          test "$out" = "fib(20) = 6765"

  # Coverage is deliberately kept off pull requests and runs after code changes
  # land on main. The size job remains a separate pull-request and main gate.
  coverage:
    name: Coverage
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum (stdlib-only module) -> nothing to cache; avoids a warning.
          cache: false

      - name: Initialize Release 3 suite
        run: git submodule update --init --depth=1 tests/spec-v3

      # Coverage executes the same Core 3 tests as the native matrix, including
      # source forms that require the official interpreter fallback.
      - name: Install Release 3 interpreter toolchain
        run: sudo apt-get update && sudo apt-get install -y ocaml-nox ocaml-dune menhir

      - name: Bootstrap pinned Core 3 tools
        run: |
          scripts/bootstrap-wabt.sh --verify
          echo "$(dirname "$(scripts/bootstrap-wabt.sh --print-path)")" >> "$GITHUB_PATH"
          interpreter="$(scripts/bootstrap-spec-interpreter.sh --print-path)"
          scripts/bootstrap-spec-interpreter.sh --verify
          echo "WAGO_SPEC_INTERPRETER=$interpreter" >> "$GITHUB_ENV"
          echo "WAGO_SPEC_INTERPRETER_REVISION=$(scripts/bootstrap-spec-interpreter.sh --print-revision)" >> "$GITHUB_ENV"

      # Coverage merges normal, focused wago_gcstats collector, guard-page,
      # spec1, spec2, and SIMD gates after the change reaches main.
      # The spec card still renders its own per-version accounting afterward.
      - name: Produce card fragments
        run: make card-fragments

      - name: Upload card fragments
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: card-fragments
          path: ci-card
          if-no-files-found: error

      - name: Upload coverage profile
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  size:
    name: Build size
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      # TinyGo (+ lld) builds the size-minimized run-only release profile.
      - uses: acifani/setup-tinygo@db56321a62b9a67922bb9ac8f9d085e218807bb3
        with:
          tinygo-version: "0.41.1"
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Measure release binary size
        env:
          CARD_BASELINE_REF: ${{ github.event_name == 'pull_request' && 'origin/main' || '' }}
        run: |
          if [ -n "$CARD_BASELINE_REF" ]; then
            git fetch --no-tags --depth=1 origin main
          fi
          mkdir -p ci-card
          SIZE_REPORT=ci-card/size.md scripts/size-card.sh

      - name: Upload size fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: card-size
          path: |
            ci-card/size.md
            ci-card/size-profiles.tsv
            ci-card/size-symbols.tsv
          if-no-files-found: error

  # Single aggregation gate. Because the path-gated jobs above can be "skipped",
  # make THIS the sole required status check in branch protection: it always runs
  # and passes only if no needed job actually failed (skipped/success both pass).
  ci-ok:
    name: CI
    if: always()
    needs: [changes, docs, lint, regression-corpus, runtime-concurrency, race, platform-test, core-v2, core-v3, tinygo, coverage, size]
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::a required job did not pass ($r)"
              exit 1
            fi
          done
          echo "all required jobs passed or were skipped"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Record exact main-branch qualification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
        run: scripts/release-qualification.sh record-ci stable-qualification/ci-qualification.json
      - name: Upload exact main-branch qualification
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-source-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: stable-qualification/ci-qualification.json
          if-no-files-found: error
          retention-days: 90
