# INACTIVE PROPOSAL. Parent must coordinate publication and activation.
# Install only through a reviewed PR; never push directly to upstream main.
name: Pinned RFWGC Darwin correctness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  darwin:
    runs-on: macos-15
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        mode: [ordinary, wagodebug, wago_regalloccheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5345bd365c13963f1bf60e26bb80789ab9ead4cc
          path: source
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.27.1'
          cache: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
        with:
          just-version: '1.58.0'
      - name: Verify tools and bootstrap pinned WABT
        working-directory: source
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          node --version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          python3 --version
          scripts/bootstrap-wabt.sh --verify
          dirname "$(scripts/bootstrap-wabt.sh --print-path)" >> "$GITHUB_PATH"
          echo "WAGO_WAST2JSON=$(scripts/bootstrap-wabt.sh --print-path)" >> "$GITHUB_ENV"
      - name: Execute correctness and retain skip accounting
        run: >-
          python3 harness/docs/rfwgc-evidence/final-darwin/run.py
          source receipts-${{ matrix.mode }} --mode '${{ matrix.mode }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: darwin-5345-${{ matrix.mode }}-${{ github.run_attempt }}
          path: receipts-${{ matrix.mode }}
          if-no-files-found: error
          retention-days: 7
